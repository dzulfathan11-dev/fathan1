<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-ring"></div>
  </div>

  <!-- Animated background -->
  <div class="bg-scene">
    <div class="bg-grid"></div>
    <div class="bg-blob blob-a"></div>
    <div class="bg-blob blob-b"></div>
    <canvas id="particles"></canvas>
  </div>

  <!-- Custom cursor (desktop only) -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Navbar -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#home" class="nav-logo" id="navLogo">A</a>
      <nav class="nav-links" id="navLinks">
        <a href="#home" class="nav-link active" data-section="home">Home</a>
        <a href="#profile" class="nav-link" data-section="profile">Profile</a>
        <a href="#about" class="nav-link" data-section="about">About</a>
      </nav>
      <button class="nav-burger" id="navBurger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile" id="navMobile">
      <a href="#home" class="nav-mobile-link" data-section="home">Home</a>
      <a href="#profile" class="nav-mobile-link" data-section="profile">Profile</a>
      <a href="#about" class="nav-mobile-link" data-section="about">About</a>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="home" class="section hero">
      <div class="hero-inner">
        <div class="hero-photo-wrap">
          <div class="hero-photo-glow"></div>
          <img class="hero-photo" id="heroPhoto" src="" alt="" onerror="this.style.display='none'">
        </div>
        <p class="hero-eyebrow" id="typedGreeting"></p>
        <h1 class="hero-name" id="heroName"></h1>
        <p class="hero-status" id="heroStatus"></p>
        <p class="hero-bio" id="heroBio"></p>
        <div class="hero-social" id="heroSocial"></div>
      </div>
      <div class="scroll-hint">
        <span></span>
      </div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="section profile-section">
      <div class="section-inner">
        <div class="profile-card reveal" id="tiltCard">
          <div class="profile-card-shine"></div>
          <div class="profile-photo-col">
            <div class="profile-photo-frame">
              <img id="profilePhoto" src="" alt="" onerror="this.style.display='none'">
            </div>
            <p class="profile-quote" id="profileQuote"></p>
          </div>
          <div class="profile-info-col">
            <span class="profile-badge" id="profileBadgeStatus"></span>
            <h2 class="profile-name" id="profileName"></h2>
            <p class="profile-nickname" id="profileNickname"></p>
            <div class="profile-grid">
              <div class="profile-field reveal">
                <span class="field-label">Sekolah</span>
                <span class="field-value" id="fieldSchool"></span>
              </div>
              <div class="profile-field reveal">
                <span class="field-label">Kelas</span>
                <span class="field-value" id="fieldClass"></span>
              </div>
              <div class="profile-field reveal">
                <span class="field-label">Jurusan</span>
                <span class="field-value" id="fieldMajor"></span>
              </div>
              <div class="profile-field reveal">
                <span class="field-label">Kota</span>
                <span class="field-value" id="fieldCity"></span>
              </div>
            </div>
            <p class="profile-bio" id="profileBio"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section about-section">
      <div class="section-inner">
        <h2 class="about-title reveal">About Me</h2>
        <p class="about-lead reveal" id="aboutLead"></p>
        <div class="about-grid">
          <div class="about-card reveal">
            <span class="about-card-label">Minat</span>
            <p id="aboutInterests"></p>
          </div>
          <div class="about-card reveal">
            <span class="about-card-label">Hobi</span>
            <p id="aboutHobbies"></p>
          </div>
          <div class="about-card reveal">
            <span class="about-card-label">Tujuan</span>
            <p id="aboutGoals"></p>
          </div>
          <div class="about-card reveal">
            <span class="about-card-label">Cita-cita</span>
            <p id="aboutDream"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
